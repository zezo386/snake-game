<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
	 crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="navbar">
        <ul class="nav-links">
            <button class="nav-link current" onclick="mode=0;document.querySelectorAll('.nav-link').forEach(element => element.className='nav-link');this.className='nav-link current'">Normal mode</button>
            <button class="nav-link" onclick="mode=1;document.querySelectorAll('.nav-link').forEach(element => element.className='nav-link');this.className='nav-link current'">Wrapless mode</button>
            <button class="nav-link" onclick="mode=2;document.querySelectorAll('.nav-link').forEach(element => element.className='nav-link');this.className='nav-link current'">Twin mode</button>
        </ul>
        <button class="reset-btn" id="restart">Restart</button>
    </div>
    <div class="container" id="container">
        <div class="score-container">
            <span id="score" class="text"></span><span id="length" class="text"></span><span id="best-score" class="text"></span>
        </div>
        <canvas id="SnakeCanvas" class="canvas">

        </canvas>
        
    </div>
    <script src="main.js"></script>
</body>
</html>
